services:
  # Service web Rails
  - type: web
    name: medieval-rpg
    env: ruby
    rootDir: ruby_game
    buildCommand: "./bin/render-build.sh"
    startCommand: "./bin/render-start.sh"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false # À définir dans le dashboard Render
      - key: DATABASE_URL
        fromDatabase:
          name: medieval-rpg-db
          property: connectionString
      - key: RAILS_SERVE_STATIC_FILES
        value: true
      - key: RAILS_LOG_TO_STDOUT
        value: true
    healthCheckPath: /
    plan: free # Plan gratuit

  # Base de données PostgreSQL
  - type: pspg
    name: medieval-rpg-db
    plan: free # Plan gratuit (limité mais suffisant pour commencer)
    databaseName: medieval_rpg_production
    user: medieval_rpg
